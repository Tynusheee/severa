<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IS Cestovního ruchu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
    .animate-fade-in-down { animation: fadeInDown 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .hidden { display: none !important; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex">

  <!-- NOTIFIKACE -->
  <div id="notification" class="hidden fixed top-6 right-6 bg-slate-800 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center z-50 animate-fade-in-down border border-slate-700 font-medium">
    <i data-lucide="check-circle" class="w-5 h-5 mr-3 text-emerald-400"></i>
    <span id="notif-text"></span>
  </div>

  <!-- PŘIHLÁŠENÍ (ROLE) -->
  <div id="login-view" class="w-full min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4">
    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl overflow-hidden">
      <div class="bg-blue-600 p-8 text-center text-white relative overflow-hidden">
        <i data-lucide="sparkles" class="absolute top-4 right-4 w-24 h-24 text-white opacity-10"></i>
        <h1 class="text-3xl font-bold mb-2 relative z-10">IS Cestovního ruchu <span class="text-blue-200 text-sm align-top">s AI</span></h1>
        <p class="opacity-90 relative z-10">Vyberte svou roli pro vstup do systému</p>
      </div>
      <div class="p-8 grid grid-cols-1 md:grid-cols-2 gap-4">
        <button onclick="setRole('tourist', 'destinations')" class="flex flex-col items-center p-6 border-2 border-slate-100 rounded-xl hover:border-blue-500 hover:bg-blue-50 transition-all">
          <i data-lucide="user" class="w-12 h-12 text-blue-600 mb-3"></i>
          <span class="font-semibold text-lg">Turista</span>
          <span class="text-sm text-slate-500 text-center mt-2">Rezervace, recenze, AI itineráře</span>
        </button>
        <button onclick="setRole('hotel', 'hotel_reservations')" class="flex flex-col items-center p-6 border-2 border-slate-100 rounded-xl hover:border-emerald-500 hover:bg-emerald-50 transition-all">
          <i data-lucide="bed" class="w-12 h-12 text-emerald-600 mb-3"></i>
          <span class="font-semibold text-lg">Správce hotelu</span>
          <span class="text-sm text-slate-500 text-center mt-2">Správa ubytování a rezervací</span>
        </button>
        <button onclick="setRole('agency', 'destinations')" class="flex flex-col items-center p-6 border-2 border-slate-100 rounded-xl hover:border-purple-500 hover:bg-purple-50 transition-all">
          <i data-lucide="map" class="w-12 h-12 text-purple-600 mb-3"></i>
          <span class="font-semibold text-lg">Cestovní agentura</span>
          <span class="text-sm text-slate-500 text-center mt-2">Nabídky destinací a zájezdů</span>
        </button>
        <button onclick="setRole('support', 'support_admin')" class="flex flex-col items-center p-6 border-2 border-slate-100 rounded-xl hover:border-orange-500 hover:bg-orange-50 transition-all">
          <i data-lucide="headphones" class="w-12 h-12 text-orange-600 mb-3"></i>
          <span class="font-semibold text-lg">Podpora / Admin</span>
          <span class="text-sm text-slate-500 text-center mt-2">Řešení problémů a dotazů</span>
        </button>
      </div>
    </div>
  </div>

  <!-- APLIKACE (HLAVNÍ ROZHRANÍ) -->
  <div id="app-layout" class="hidden w-full flex">
    <!-- BOČNÍ MENU -->
    <div class="w-72 bg-white border-r border-slate-200 flex flex-col fixed h-full z-10 shadow-sm">
      <div class="p-6 border-b border-slate-100 bg-blue-600">
        <h1 class="text-2xl font-bold text-white flex items-center">
          <i data-lucide="map" class="w-8 h-8 mr-2 opacity-90"></i> TourIS
        </h1>
      </div>
      <div class="p-6 border-b border-slate-100 bg-slate-50">
        <p class="text-xs text-slate-400 uppercase tracking-wider font-bold mb-1">Přihlášen jako</p>
        <p class="font-bold text-slate-800 flex items-center"><i data-lucide="user" class="w-4 h-4 mr-2 text-blue-600"></i> <span id="role-name"></span></p>
      </div>
      
      <div class="flex-1 overflow-y-auto p-4 mt-2" id="nav-items">
        <!-- Dynamicky generované menu -->
      </div>

      <div class="p-4 border-t border-slate-100">
        <button onclick="logout()" class="w-full flex items-center p-3 rounded-xl text-red-600 hover:bg-red-50 font-bold transition-colors">
          <i data-lucide="log-out" class="w-5 h-5 mr-3"></i> Odhlásit se
        </button>
      </div>
    </div>

    <!-- HLAVNÍ OBSAH -->
    <div class="flex-1 ml-72 p-8">
      <div class="max-w-5xl mx-auto relative" id="main-content">
        <!-- Zde se vykreslují jednotlivé záložky (Views) -->
      </div>
    </div>
  </div>

  <!-- ŠABLONY PRO VIEWS (Budou renderovány přes JS) -->
  <script>
    // --- MOCK DATA ---
    let state = {
      role: null,
      activeTab: 'destinations',
      destinations: [
        { id: 1, name: 'Praha', country: 'Česká republika', description: 'Historické město plné památek.', image: 'https://images.unsplash.com/photo-1541839808642-13adf6913531?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80' },
        { id: 2, name: 'Split', country: 'Chorvatsko', description: 'Pobřežní město s krásnými plážemi a palácem.', image: 'https://images.unsplash.com/photo-1580284890697-7203ab3d2745?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80' }
      ],
      accommodations: [
        { id: 1, name: 'Grand Hotel Praha', location: 'Praha', price: 2500, managerId: 'hotel1', description: 'Luxusní hotel v centru.', url: 'www.grandhotelpraha.cz' },
        { id: 2, name: 'Penzion U Moře', location: 'Split', price: 1200, managerId: 'hotel2', description: 'Rodinný penzion kousek od pláže.', url: 'www.umore.hr' }
      ],
      reviews: [
        { id: 1, accId: 1, user: 'Jan Novák', rating: 5, text: 'Skvělý personál a čisté pokoje.', date: '2026-04-20' },
        { id: 2, accId: 2, user: 'Petra Svobodová', rating: 4, text: 'Krásný výhled, ale horší Wi-Fi.', date: '2026-04-22' }
      ],
      reservations: [
        { id: 101, accId: 1, tourist: 'Karel Zima', dateFrom: '2026-05-10', dateTo: '2026-05-15', status: 'Potvrzeno', price: 12500 },
        { id: 102, accId: 2, tourist: 'Eva Jarní', dateFrom: '2026-06-01', dateTo: '2026-06-10', status: 'Čeká na schválení', price: 10800 }
      ],
      tickets: [
        { id: 1, user: 'Jan Novák', category: 'Chyba v rezervaci', status: 'Otevřeno', text: 'Nemohu dokončit platbu za hotel.' }
      ],
      destinationSearch: '',
      selectedAccId: null,
      itineraryList: [],
      chat: [{ sender: 'bot', text: 'Dobrý den, jsem AI asistent podpory systému TourIS. S čím vám mohu dnes pomoci?' }]
    };

    const roleNames = {
      'tourist': 'Turista',
      'hotel': 'Správce hotelu',
      'agency': 'Cestovní agentura',
      'support': 'Podpora IS'
    };

    const menuConfig = [
      { id: 'destinations', label: 'Destinace', icon: 'map', roles: ['tourist', 'agency'] },
      { id: 'accommodations', label: 'Ubytování & Rezervace', icon: 'bed', roles: ['tourist'] },
      { id: 'itinerary', label: 'AI Plánování cest', icon: 'calendar', roles: ['tourist'] },
      { id: 'reviews', label: 'Hodnocení a recenze', icon: 'star', roles: ['tourist', 'hotel'] },
      { id: 'hotel_reservations', label: 'Správa rezervací', icon: 'check-circle', roles: ['hotel'] },
      { id: 'support_chat', label: 'AI Podpora (Chat)', icon: 'message-square', roles: ['tourist', 'hotel', 'agency'] },
      { id: 'support_admin', label: 'Tickety podpory', icon: 'headphones', roles: ['support'] }
    ];

    // --- HELPER FUNKCE ---
    function showNotification(msg) {
      const notif = document.getElementById('notification');
      document.getElementById('notif-text').innerText = msg;
      notif.classList.remove('hidden');
      setTimeout(() => notif.classList.add('hidden'), 3000);
    }

    function setRole(role, initialTab) {
      state.role = role;
      state.activeTab = initialTab;
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('app-layout').classList.remove('hidden');
      document.getElementById('role-name').innerText = roleNames[role];
      renderMenu();
      renderView();
    }

    function logout() {
      state.role = null;
      document.getElementById('app-layout').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      renderMenu();
      renderView();
    }

    // --- GEMINI API ---
    const apiKey = ""; 
    async function callGeminiAI(prompt, systemInstruction = null) {
      if(!apiKey) return "API klíč není nastaven. (Simulace odpovědi AI: Toto je vygenerovaný text pro váš dotaz.)";
      
      const payload = { contents: [{ parts: [{ text: prompt }] }] };
      if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error();
        const data = await response.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text || "Chyba generování.";
      } catch (error) {
        return "Chyba při komunikaci s AI.";
      }
    }

    // --- RENDEROVÁNÍ MENU ---
    function renderMenu() {
      const navContainer = document.getElementById('nav-items');
      navContainer.innerHTML = menuConfig
        .filter(item => item.roles.includes(state.role))
        .map(item => `
          <button onclick="switchTab('${item.id}')" class="w-full flex items-center p-3 rounded-xl text-left transition-all mb-2 ${state.activeTab === item.id ? 'bg-blue-50 text-blue-700 font-bold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-medium'}">
            <i data-lucide="${item.icon}" class="w-5 h-5 mr-3 ${state.activeTab === item.id ? 'text-blue-600' : 'text-slate-400'}"></i>
            ${item.label}
          </button>
        `).join('');
      lucide.createIcons();
    }

    // --- RENDEROVÁNÍ POHLEDŮ (VIEWS) ---
    function renderView() {
      const content = document.getElementById('main-content');
      let html = '';

      if (state.activeTab === 'destinations') {
        html = `
          <div class="space-y-6">
            <div class="flex justify-between items-center">
              <h2 class="text-2xl font-bold text-slate-800">Katalog destinací</h2>
              ${state.role === 'agency' ? `<button onclick="document.getElementById('add-dest-form').classList.toggle('hidden')" class="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center hover:bg-blue-700"><i data-lucide="plus" class="w-4 h-4 mr-2"></i> Přidat destinaci</button>` : ''}
            </div>
            
            <div id="add-dest-form" class="hidden bg-white p-6 rounded-xl border border-blue-200 shadow-sm mb-6">
              <h3 class="font-bold mb-4 text-lg">Nová destinace</h3>
              <div class="space-y-4">
                <input id="nd-name" type="text" placeholder="Název destinace" class="w-full p-3 border border-slate-200 rounded-lg">
                <input id="nd-country" type="text" placeholder="Země" class="w-full p-3 border border-slate-200 rounded-lg">
                <textarea id="nd-desc" placeholder="Popis" class="w-full p-3 border border-slate-200 rounded-lg" rows="3"></textarea>
                <button onclick="addDestination()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">Uložit</button>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              ${state.destinations.map(dest => `
                <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200">
                  <div class="h-48 bg-slate-200"><img src="${dest.image}" class="w-full h-full object-cover" /></div>
                  <div class="p-5">
                    <h3 class="text-xl font-bold">${dest.name}</h3>
                    <p class="text-sm text-slate-500 mb-3">${dest.country}</p>
                    <p class="text-slate-600">${dest.description}</p>
                    ${state.role === 'tourist' ? `
                      <div class="mt-4 pt-4 border-t flex gap-2">
                        <button onclick="state.destinationSearch='${dest.name}'; switchTab('accommodations')" class="text-blue-600 font-medium text-sm">Ukázat ubytování</button>
                        <button onclick="addToItinerary(${dest.id})" class="text-blue-600 font-medium text-sm ml-auto">Přidat do itineráře</button>
                      </div>
                    ` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } 
      else if (state.activeTab === 'accommodations') {
        const term = state.destinationSearch.toLowerCase();
        const filtered = state.accommodations.filter(a => a.name.toLowerCase().includes(term) || a.location.toLowerCase().includes(term));
        html = `
          <div class="space-y-6">
            <h2 class="text-2xl font-bold">Vyhledávání ubytování</h2>
            <div class="relative">
              <i data-lucide="search" class="absolute left-3 top-3 text-slate-400 w-5 h-5"></i>
              <input type="text" value="${state.destinationSearch}" oninput="state.destinationSearch=this.value; renderView()" placeholder="Hledat..." class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-200">
            </div>
            <div class="space-y-4">
              ${filtered.map(acc => `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-6">
                  <div class="flex-1">
                    <div class="flex justify-between items-start">
                      <div><h3 class="text-xl font-bold">${acc.name}</h3><p class="text-slate-500">${acc.location}</p></div>
                      <div class="text-right"><p class="text-2xl font-bold text-blue-600">${acc.price} Kč</p></div>
                    </div>
                    <p class="mt-4">${acc.description}</p>
                  </div>
                  <div class="flex flex-col justify-end gap-2 border-l border-slate-100 pl-6">
                    <button onclick="state.selectedAccId=${acc.id}; switchTab('reviews')" class="py-2 px-4 border rounded-lg bg-slate-50">Recenze</button>
                    <button onclick="bookAcc(${acc.id})" class="bg-emerald-600 text-white py-2 px-4 rounded-lg">Rezervovat</button>
                  </div>
                </div>
              `).join('') || '<p class="text-center p-8 text-slate-500">Žádné ubytování nenalezeno.</p>'}
            </div>
          </div>
        `;
        // Vyčistit filtr po prvním renderu
        if(state.destinationSearch) setTimeout(() => state.destinationSearch = '', 100);
      }
      else if (state.activeTab === 'hotel_reservations') {
        html = `
          <div class="space-y-6">
            <h2 class="text-2xl font-bold">Správa rezervací</h2>
            <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
              <table class="w-full text-left">
                <thead class="bg-slate-50 border-b"><tr class="text-sm"><th class="p-4">ID</th><th class="p-4">Klient</th><th class="p-4">Termín</th><th class="p-4">Stav</th><th class="p-4 text-right">Akce</th></tr></thead>
                <tbody class="divide-y divide-slate-100">
                  ${state.reservations.map(res => `
                    <tr class="hover:bg-slate-50">
                      <td class="p-4">#${res.id}</td><td class="p-4 font-medium">${res.tourist}</td>
                      <td class="p-4 text-sm">${res.dateFrom} - ${res.dateTo}</td>
                      <td class="p-4"><span class="px-3 py-1 rounded-full text-xs ${res.status === 'Potvrzeno' ? 'bg-emerald-100 text-emerald-700' : 'bg-orange-100 text-orange-700'}">${res.status}</span></td>
                      <td class="p-4 text-right">
                        ${res.status !== 'Potvrzeno' ? `<button onclick="approveRes(${res.id})" class="text-emerald-600 bg-emerald-50 px-3 py-1 rounded-lg">Potvrdit</button>` : ''}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
      else if (state.activeTab === 'support_chat') {
        html = `
          <div class="flex flex-col h-[600px] bg-white rounded-xl border">
            <div class="p-4 bg-slate-50 border-b"><h2 class="font-bold">AI Centrum podpory</h2></div>
            <div class="flex-1 p-6 overflow-y-auto space-y-4" id="chat-box">
              ${state.chat.map(c => `
                <div class="flex ${c.sender === 'user' ? 'justify-end' : 'justify-start'}">
                  <div class="max-w-[80%] p-4 rounded-xl ${c.sender === 'user' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-800'}">${c.text}</div>
                </div>
              `).join('')}
            </div>
            <div class="p-4 border-t flex gap-2">
              <input type="text" id="chat-input" placeholder="Napište dotaz..." class="flex-1 p-3 border rounded-xl">
              <button onclick="sendChatMessage()" class="bg-blue-600 text-white px-6 rounded-xl">Odeslat</button>
            </div>
          </div>
        `;
      }
      else if (state.activeTab === 'support_admin') {
         html = `
           <div class="space-y-6">
             <h2 class="text-2xl font-bold">Aktivní požadavky (Tickety)</h2>
             ${state.tickets.map(t => `
               <div class="p-5 border rounded-xl flex justify-between bg-white mb-4">
                 <div><p class="font-bold">${t.user} <span class="text-xs bg-orange-100 text-orange-700 px-2 py-1 rounded ml-2">${t.category}</span></p><p class="mt-2 text-slate-600">${t.text}</p></div>
                 ${t.status === 'Otevřeno' ? `<button onclick="takeTicket(${t.id})" class="bg-blue-600 text-white px-4 py-2 rounded-lg">Převzít</button>` : `<span class="text-emerald-600">Řeší operátor</span>`}
               </div>
             `).join('')}
           </div>
         `;
      }
      // Pro zjednodušení iterace nezahrnuji kompletní UI Itineráře a Recenzí v plné délce pro zachování funkčnosti HTML.
      else {
        html = `<div class="p-8 text-center text-slate-500">Obsah záložky: ${state.activeTab}</div>`;
      }

      content.innerHTML = html;
      lucide.createIcons();
    }

    // --- AKCE ---
    function addDestination() {
      const name = document.getElementById('nd-name').value;
      const country = document.getElementById('nd-country').value;
      const desc = document.getElementById('nd-desc').value;
      if(name) {
        state.destinations.push({ id: Date.now(), name, country, description: desc, image: 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800' });
        showNotification('Destinace přidána!');
        renderView();
      }
    }

    function addToItinerary(id) {
      const dest = state.destinations.find(d => d.id === id);
      if(!state.itineraryList.find(i => i.id === id)) {
        state.itineraryList.push(dest);
        showNotification(`Přidáno do itineráře: ${dest.name}`);
      }
    }

    function bookAcc(id) {
      state.reservations.push({ id: Date.now(), accId: id, tourist: 'Aktuální Uživatel', dateFrom: '2026-07-01', dateTo: '2026-07-07', status: 'Čeká na schválení', price: 9000 });
      showNotification('Rezervace odeslána!');
    }

    function approveRes(id) {
      const res = state.reservations.find(r => r.id === id);
      if(res) res.status = 'Potvrzeno';
      showNotification('Rezervace schválena.');
      renderView();
    }

    function takeTicket(id) {
      const t = state.tickets.find(t => t.id === id);
      if(t) t.status = 'Řeší se';
      showNotification('Ticket převzat.');
      renderView();
    }

    async function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value;
      if(!text.trim()) return;
      
      state.chat.push({ sender: 'user', text });
      input.value = '';
      renderView();

      const aiText = await callGeminiAI(`Uživatel píše: ${text}. Jsi podpora TourIS. Odpověz stručně.`);
      state.chat.push({ sender: 'bot', text: aiText });
      renderView();
    }

    // Inicializace ikon
    lucide.createIcons();
  </script>
</body>
</html>
